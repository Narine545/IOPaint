name: tests

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[plugins]"
          pip install -r requirements-dev.txt
          # the CI runner has no display, use the headless OpenCV build
          pip uninstall -y opencv-python
          pip install "opencv-python-headless<5"

      - name: Import smoke test (no diffusers installed)
        run: |
          python -c "import iopaint, iopaint.api, iopaint.cli; print('ok')"
          python -c "from iopaint.model import models, erase_models; print(sorted(erase_models))"
          python -m iopaint --help

      - name: Run model-free tests
        run: |
          pytest -q iopaint/tests/test_alpha_matting.py iopaint/tests/test_remove_bg_pipeline.py
